services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      # Connection URLs use compose service names — DO NOT rely on the
      # host-friendly DATABASE_URL/REDIS_URL/S3_ENDPOINT from .env, which
      # point at localhost.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      # Everything else passes through from .env.
      NODE_ENV: ${NODE_ENV}
      API_PORT: ${API_PORT}
      API_HOST: ${API_HOST}
      API_LOG_LEVEL: ${API_LOG_LEVEL}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      WIDGET_JWT_SECRET: ${WIDGET_JWT_SECRET}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      WIDGET_ALLOWED_ORIGINS: ${WIDGET_ALLOWED_ORIGINS}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME}
      # --- Licensing (production stacks must set these in .env) ---
      LICENSE_ENFORCEMENT: ${LICENSE_ENFORCEMENT:-enabled}
      LICENSE_TOKEN: ${LICENSE_TOKEN}
      LICENSE_PUBLIC_KEY_PEM: ${LICENSE_PUBLIC_KEY_PEM:-}
      LICENSE_PUBLIC_KEY_PATH: ${LICENSE_PUBLIC_KEY_PATH:-}
      LICENSE_SERVER_URL: ${LICENSE_SERVER_URL}
      LICENSE_HEARTBEAT_SECONDS: ${LICENSE_HEARTBEAT_SECONDS:-1800}
      LICENSE_HEARTBEAT_GRACE_SECONDS: ${LICENSE_HEARTBEAT_GRACE_SECONDS:-86400}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - dashboard_dist:/srv/dashboard:ro
      - widget_dist:/srv/widget:ro
    depends_on:
      - api

  dashboard-build:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    volumes:
      - dashboard_dist:/out

  widget-build:
    build:
      context: .
      dockerfile: apps/widget/Dockerfile
    volumes:
      - widget_dist:/out

volumes:
  postgres_data:
  redis_data:
  minio_data:
  dashboard_dist:
  widget_dist:
