user nginx;
worker_processes auto;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 10M;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream hza_api {
    server api:3000;
    keepalive 32;
  }

  # HTTP: redirect to HTTPS in production. In dev, remove this server block
  # and make the :80 block below the main one.
  server {
    listen 80 default_server;
    # For initial bring-up, serve directly. In production, uncomment the
    # redirect and use the HTTPS server block below.
    # return 301 https://$host$request_uri;

    root /srv/dashboard;
    index index.html;

    # Agent dashboard (SPA)
    location /dashboard/ {
      alias /srv/dashboard/;
      try_files $uri /dashboard/index.html;
    }
    location = /dashboard { return 301 /dashboard/; }

    # Widget loader
    location = /widget.js {
      alias /srv/widget/widget.js;
      add_header Cache-Control "public, max-age=60";
      add_header Access-Control-Allow-Origin *;
    }

    # Widget iframe + assets
    location /widget/ {
      alias /srv/widget/widget/;
      add_header Access-Control-Allow-Origin *;
    }
    location = /widget/frame.html {
      alias /srv/widget/frame.html;
    }

    # REST API
    location /api/ {
      proxy_pass http://hza_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO WebSocket
    location /ws {
      proxy_pass http://hza_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Use $http_host (Host header, including any port) so the redirect
    # works on non-standard ports like the :8080 used in dev/CI.
    location = / {
      return 302 $scheme://$http_host/dashboard/;
    }

    # Optional dev-only fixtures (mounted by docker-compose.dev-fixtures.yml).
    # In a casino deployment this directory is empty and the include matches
    # nothing.
    include /etc/nginx/locations.d/*.conf;
  }

  # HTTPS — uncomment after placing certs in /etc/nginx/tls/.
  # server {
  #   listen 443 ssl http2;
  #   ssl_certificate /etc/nginx/tls/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/tls/privkey.pem;
  #   # ...duplicate location blocks from the :80 server above...
  # }
}
