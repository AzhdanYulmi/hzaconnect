# Casino-side production compose for self-deploy installs.
# All images are pre-built and pulled from GHCR — never built on the host.
# Updates: `hzaconnect update` (docker compose pull + migrate + recreate).

name: hzaconnect

x-image-defaults: &image-defaults
  HZA_REGISTRY: ${HZA_REGISTRY:-ghcr.io/AzhdanYulmi}
  HZA_VERSION: ${HZA_VERSION:-latest}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    image: ${HZA_REGISTRY:-ghcr.io/AzhdanYulmi}/hzaconnect-api:${HZA_VERSION:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      NODE_ENV: production
      API_PORT: "3000"
      API_HOST: 0.0.0.0
      API_LOG_LEVEL: ${API_LOG_LEVEL:-info}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-hzaconnect-attachments}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_ENDPOINT: ${PUBLIC_ORIGIN}/s3
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      WIDGET_JWT_SECRET: ${WIDGET_JWT_SECRET}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      WIDGET_ALLOWED_ORIGINS: ${WIDGET_ALLOWED_ORIGINS:-*}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-Admin}
      LICENSE_ENFORCEMENT: enabled
      LICENSE_TOKEN: ${LICENSE_TOKEN}
      LICENSE_PUBLIC_KEY_PATH: /license-keys/public.pem
      LICENSE_SERVER_URL: ${LICENSE_SERVER_URL}
      LICENSE_HEARTBEAT_SECONDS: ${LICENSE_HEARTBEAT_SECONDS:-1800}
      LICENSE_HEARTBEAT_GRACE_SECONDS: ${LICENSE_HEARTBEAT_GRACE_SECONDS:-86400}
    volumes:
      - ./license-keys:/license-keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  edge:
    image: ${HZA_REGISTRY:-ghcr.io/AzhdanYulmi}/hzaconnect-edge:${HZA_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # SITE_ADDR controls scheme + TLS: https://example.com (default) gets auto-TLS;
      # http://localhost or http://${DOMAIN} disables TLS for localhost / behind-tunnel installs.
      SITE_ADDR: ${SITE_ADDR:-https://${DOMAIN}}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
