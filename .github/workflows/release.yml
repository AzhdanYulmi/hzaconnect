name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.2.3)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  # ---------------- Build + push Docker images to GHCR ----------------
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push hzaconnect-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.ver.outputs.owner_lc }}/hzaconnect-api:${{ steps.ver.outputs.tag }}
            ghcr.io/${{ steps.ver.outputs.owner_lc }}/hzaconnect-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build + push hzaconnect-edge
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/install/edge.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.ver.outputs.owner_lc }}/hzaconnect-edge:${{ steps.ver.outputs.tag }}
            ghcr.io/${{ steps.ver.outputs.owner_lc }}/hzaconnect-edge:latest
          cache-from: type=gha,scope=edge
          cache-to: type=gha,scope=edge,mode=max

  # ---------------- Bundle the install scripts as a release asset ----------------
  bundle:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build deploy bundle
        run: |
          mkdir -p out
          cp deploy/install/docker-compose.deploy.yml \
             deploy/install/Caddyfile \
             deploy/install/install.sh \
             deploy/install/update.sh \
             deploy/install/doctor.sh \
             deploy/install/hzaconnect \
             deploy/install/bootstrap.sh \
             deploy/install/.env.example \
             out/
          chmod +x out/install.sh out/update.sh out/doctor.sh out/hzaconnect out/bootstrap.sh
          tar -C out -czf "hzaconnect-deploy-${{ steps.ver.outputs.tag }}.tar.gz" .
          sha256sum "hzaconnect-deploy-${{ steps.ver.outputs.tag }}.tar.gz" > "hzaconnect-deploy-${{ steps.ver.outputs.tag }}.tar.gz.sha256"

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            hzaconnect-deploy-*.tar.gz
            hzaconnect-deploy-*.tar.gz.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: hzaconnect-deploy-${{ steps.ver.outputs.tag }}
          path: hzaconnect-deploy-*.tar.gz*
